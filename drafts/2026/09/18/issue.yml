title: 海水的盐从哪里来，以及月亮为什么总用同一面朝向地球
daily_summary: 今天先追踪海洋盐分的来源：岩石风化、河流输送与海底热液共同参与，而蒸发主要改变局部盐度；再看月球的同步自转，理解它为何一边绕地球、一边转动，却仍长期以同一面朝向我们。
