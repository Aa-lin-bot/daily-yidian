{% extends "base.html" %}
{% block title %}{{ title }}｜{{ site_name }}{% endblock %}
{% block content %}
<main class="shell"><section class="collection-header"><div class="kicker">COLLECTION</div><h1>{{ title }}</h1><p>共 {{ articles|length }} 篇文章。</p></section><div class="grid">{% for a in articles %}<a class="card" href="{{ root }}articles/{{ a.slug }}/"><img loading="lazy" src="{{ root }}{{ a.images[0].path }}" alt="{{ a.images[0].alt }}"><div class="card-body"><div class="meta"><span class="pill">{{ a.category }}</span><span>{{ a.reading_minutes }} 分钟</span></div><h3>{{ a.title }}</h3><p>{{ a.summary }}</p></div></a>{% endfor %}</div><div class="spacer"></div></main>
{% endblock %}
