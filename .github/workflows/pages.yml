name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "drafts/**"
      - "reports/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install builder dependencies
        run: pip install -r requirements.txt

      - name: Prepare local article images
        run: python prepare_images.py

      - name: Build static magazine
        run: python build.py

      - name: Verify build
        run: |
          test -f site/index.html
          test -f site/feed.xml
          test -f site/atom.xml
          test -f site/search_index.json
          test -f site/downloads/issue-001.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
