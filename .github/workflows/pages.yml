name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install builder dependencies
        run: pip install -r requirements.txt

      - name: Prepare local article images
        run: |
          mkdir -p assets/images
          curl --fail --location --retry 3 --user-agent "daily-yidian/2.0" "https://upload.wikimedia.org/wikipedia/commons/1/10/Giant_Pacific_Octopus.jpg" -o assets/images/octopus.jpg
          curl --fail --location --retry 3 --user-agent "daily-yidian/2.0" "https://upload.wikimedia.org/wikipedia/commons/thumb/1/12/Saturn_global_view_from_Cassini%2C_rings_open.jpg/960px-Saturn_global_view_from_Cassini%2C_rings_open.jpg" -o assets/images/saturn.jpg
          curl --fail --location --retry 3 --user-agent "daily-yidian/2.0" "https://commons.wikimedia.org/wiki/Special:Redirect/file/Tectonic_plates_%282022%29.svg" -o assets/images/plates.svg

      - name: Build static magazine
        run: python build.py

      - name: Verify build
        run: |
          test -f site/index.html
          test -f site/feed.xml
          test -f site/atom.xml
          test -f site/search_index.json
          test -f site/downloads/issue-001.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
